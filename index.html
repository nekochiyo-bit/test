<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロックパズル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ブロックパズル</h1>
        </header>

        <div class="game-area">
            <div class="side-panel">
                <div class="info-box">
                    <h3>NEXT</h3>
                    <canvas id="nextCanvas" width="120" height="120"></canvas>
                </div>

                <div class="info-box">
                    <div class="score-item">
                        <span class="label">スコア:</span>
                        <span id="score" class="value">0</span>
                    </div>
                    <div class="score-item">
                        <span class="label">レベル:</span>
                        <span id="level" class="value">1</span>
                    </div>
                    <div class="score-item">
                        <span class="label">ライン:</span>
                        <span id="lines" class="value">0</span>
                    </div>
                </div>

                <button id="restartBtn" class="btn">リスタート</button>
            </div>

            <div class="game-board">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <div id="pauseOverlay" class="pause-overlay hidden">
                    <div class="pause-text">一時停止</div>
                    <div class="pause-hint">Pキーで再開</div>
                </div>
                <div id="gameOverOverlay" class="game-over-overlay hidden">
                    <div class="game-over-text">GAME OVER</div>
                    <button id="gameOverRestartBtn" class="btn">もう一度</button>
                </div>
            </div>
        </div>

        <!-- モバイル用タッチ操作ボタン -->
        <div class="mobile-controls">
            <div class="control-row">
                <button id="btnLeft" class="control-btn">←</button>
                <button id="btnRotate" class="control-btn">回転</button>
                <button id="btnRight" class="control-btn">→</button>
            </div>
            <div class="control-row">
                <button id="btnDown" class="control-btn">↓</button>
                <button id="btnDrop" class="control-btn wide">ドロップ</button>
            </div>
        </div>

        <div class="instructions">
            <h3>操作方法</h3>
            <div class="instruction-grid">
                <div class="instruction-item">
                    <span class="key">←→</span>
                    <span>左右移動</span>
                </div>
                <div class="instruction-item">
                    <span class="key">↑</span>
                    <span>回転</span>
                </div>
                <div class="instruction-item">
                    <span class="key">↓</span>
                    <span>ソフトドロップ</span>
                </div>
                <div class="instruction-item">
                    <span class="key">Space</span>
                    <span>ハードドロップ</span>
                </div>
                <div class="instruction-item">
                    <span class="key">P</span>
                    <span>一時停止</span>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
